<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WEB</title>
    <link rel="stylesheet" href="style копія 2.css">
</head>
<body>
<div class="form">

    <div class="input-row">
        <label>Username:</label>
        <input type="text">
    </div>

    <div class="input-row">
        <label>Password:</label>
        <input type="password">
    </div>

    <div class="input-row">
        <label>City of Employment:</label>
        <input type="text">
    </div>

    <div class="input-row">
        <label>Web server:</label>
        <select id="web-server">
            <option value="">-- Choose a server --</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
        </select>
    </div>

    <div class="input-row">
        <label>Please specify your role:</label>
        <div class="checkbox-group">
            <input type="checkbox"> Admin
            <input type="checkbox"> Engineer
            <input type="checkbox"> Manager
            <input type="checkbox"> Guest
        </div>
    </div>

    <div class="input-row">
        <label>Single sign-on the following:</label>
        <div class="checkbox-group">
            <input type="checkbox"> Mail
            <input type="checkbox"> Payroll
            <input type="checkbox"> Self-service
        </div>
    </div>

    <div class="input-row">
        <input type="submit" value="Login">
        <input type="submit" value="Reset">
    </div>

</div>

</body>
</html>
